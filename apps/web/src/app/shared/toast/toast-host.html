<div
  #surface
  popover="manual"
  class="toast"
  [class.error]="toast.current()?.kind === 'error'"
  [class.success]="toast.current()?.kind === 'success'"
  [attr.role]="toast.current()?.kind === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="toast.current()?.kind === 'error' ? 'assertive' : 'polite'"
  aria-atomic="true"
  (pointerenter)="toast.pause()"
  (pointerleave)="resume()"
  (focusin)="toast.pause()"
  (focusout)="resume()"
>
  @if (toast.current(); as notice) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @switch (notice.kind) {
        @case ('success') {
          <path d="m5 12 4 4L19 6" />
        }
        @case ('error') {
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v6m0 4h.01" />
        }
        @default {
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6m0-10h.01" />
        }
      }
    </svg>
    <span>{{ notice.message | t }}</span>
    <button
      type="button"
      class="toast-close"
      (click)="toast.dismiss()"
      [attr.aria-label]="'Dismiss notification' | t"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
    </button>
  }
</div>
