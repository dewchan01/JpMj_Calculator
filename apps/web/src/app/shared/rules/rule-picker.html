<section class="rules-summary">
  <div class="rules-heading">
    <div>
      <small>{{ 'Rules' | t }} · {{ profile().playerCount }}P</small>
      <strong>
        {{
          profile().preset === 'custom' && profile().name
            ? profile().name
            : (ruleName(profile()) | t)
        }}
      </strong>
    </div>
    <a routerLink="/settings" [queryParams]="{ players: profile().playerCount }">
      {{ 'Settings' | t }}
    </a>
  </div>
  @if (locked()) {
    <p class="hint">
      {{
        'This match keeps its saved rule snapshot. Start a new match to use different rules.' | t
      }}
    </p>
  }
</section>
