<div class="dice" [class.rolling]="diceRolling()" aria-hidden="true">
  @for (face of dice; track $index) {
    <div class="die" [class.one]="face === 1">
      @for (dot of dieDots; track dot) {
        <span [class.visible]="diePips[face].includes(dot)"></span>
      }
    </div>
  }
</div>
<p class="dice-result" role="status">
  @if (diceRolling()) {
    {{ 'Rolling…' | t }}
  } @else {
    {{ dice[0] }} + {{ dice[1] }} = {{ dice[0] + dice[1] }}
  }
</p>
<button class="primary full" (click)="rollDice()" [disabled]="diceRolling()">
  {{ 'Roll two dice' | t }}
</button>
