<span
  class="connection-chip"
  [class.compact]="compact()"
  role="status"
  [class.connected]="state() === 'Connected'"
  [class.connecting]="state() === 'Connecting' || state() === 'Reconnecting'"
  [class.unknown]="state() === 'Unknown'"
  [attr.aria-label]="label() || state() | t"
  [title]="label() || state() | t"
>
  <span class="connection-pulse" aria-hidden="true"></span>
  @if (!compact()) {
    <span aria-hidden="true">{{ label() || state() | t }}</span>
  }
</span>
