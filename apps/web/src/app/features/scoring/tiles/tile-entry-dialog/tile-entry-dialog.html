<button class="secondary" [attr.aria-label]="label() | t" (click)="show()">
  {{ buttonText() ?? label() | t }}
</button>
<dialog
  appDialogBackdrop
  #dialog
  [attr.aria-label]="label() | t"
  (close)="opened.set(false)"
  (cancel)="$event.preventDefault(); close()"
  (touchstart)="touchStart($event)"
  (touchmove)="touchMove($event)"
  (touchend)="touchEnd()"
  (touchcancel)="touchEnd(true)"
  [class.dragging]="dragging()"
  [style.transform]="dragOffset() ? 'translateY(' + dragOffset() + 'px)' : null"
>
  <div class="sheet-header">
    <div class="sheet-grip" aria-hidden="true"><span></span></div>
    <header>
      <h2>{{ label() | t }}</h2>
      <button class="secondary" (click)="close()" [disabled]="!canFinish()">
        {{ 'Done' | t }}
      </button>
    </header>
  </div>
  @if (opened()) {
    <div class="sheet-content">
      <ng-container [ngTemplateOutlet]="content()" />
    </div>
  }
</dialog>
