<app-error-notice [message]="error()" />
@if (match(); as game) {
  <app-final-results
    class="saved-results"
    [match]="game"
    [showEditAction]="false"
    (matchChanged)="match.set($event)"
  >
    <header resultHeading class="record-result-heading">
      <a class="icon-button" routerLink="/records" [attr.aria-label]="'Back' | t">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14" /></svg>
      </a>
      <h1>{{ match()?.name || ('Final results' | t) }}</h1>
      @if (match()) {
        <div class="record-management">
          <button
            class="icon-button"
            (click)="resultView()?.editScores()"
            [disabled]="busy()"
            [attr.aria-label]="'Edit scores' | t"
            [title]="'Edit scores' | t"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m16 3 5 5-13 13H3v-5ZM14 5l5 5" />
            </svg>
          </button>
          <button
            class="icon-button danger action-delete"
            (click)="deleteDialog.showModal()"
            [disabled]="busy()"
            [attr.aria-label]="'Delete' | t"
            [title]="'Delete' | t"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7" />
            </svg>
          </button>
        </div>
      }
    </header>
  </app-final-results>
}
<dialog appDialogBackdrop #deleteDialog class="app-dialog" aria-labelledby="delete-title">
  <header class="dialog-header">
    <h2 id="delete-title">{{ 'Delete' | t }}</h2>
    <button class="icon-button" (click)="deleteDialog.close()" [attr.aria-label]="'Close' | t">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
    </button>
  </header>
  <div class="dialog-body">
    <p>{{ 'Delete this game and all its history?' | t }}</p>
    <app-error-notice [message]="error()" />
    <div class="dialog-actions">
      <button class="action-cancel" (click)="deleteDialog.close()">{{ 'Cancel' | t }}</button>
      <button class="action-delete danger" (click)="remove()" [disabled]="busy()">
        {{ 'Delete' | t }}
      </button>
    </div>
  </div>
</dialog>
