<div class="sticky-header">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">發</span>
      <span>
        Riichi
        <span class="brand-light">/ table</span>
      </span>
    </a>
    <div class="header-tools">
      <button
        class="theme-toggle sound-toggle"
        (click)="toggleSound()"
        [attr.aria-label]="(sounds.enabled() ? 'Mute sound effects' : 'Unmute sound effects') | t"
        [attr.title]="(sounds.enabled() ? 'Mute sound effects' : 'Unmute sound effects') | t"
        [attr.aria-pressed]="!sounds.enabled()"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M11 4 6 8H3v8h3l5 4Z" />
          @if (sounds.enabled()) {
            <path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
          } @else {
            <path d="m16 9 6 6m0-6-6 6" />
          }
        </svg>
      </button>
      <button
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-pressed]="theme.dark()"
        [attr.aria-label]="'Dark mode' | t"
        [attr.title]="(theme.dark() ? 'Switch to light mode' : 'Switch to dark mode') | t"
      >
        @if (theme.dark()) {
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
            />
          </svg>
        } @else {
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z" />
          </svg>
        }
      </button>
      <select
        class="language-select"
        aria-label="Language / 語言"
        [value]="i18n.locale()"
        (change)="changeLanguage($event)"
      >
        <option value="en">English</option>
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="ja">日本語</option>
      </select>
    </div>
  </header>
</div>
<div class="app-navigation" [class.in-game]="liveTable()">
  <nav [attr.aria-label]="'Main navigation' | t">
    <a
      routerLink="/"
      [class.active]="tableActive()"
      [attr.aria-current]="tableActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
      </svg>
      {{ 'My table' | t }}
    </a>
    <a routerLink="/settings" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" />
        <circle cx="15" cy="17" r="3" />
      </svg>
      {{ 'Settings' | t }}
    </a>

    <a routerLink="/records" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 3h16v18H4zM8 7h8M8 12h8M8 17h5" />
      </svg>
      {{ 'Records' | t }}
    </a>
    <a routerLink="/others" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5" cy="12" r="1.5" />
        <circle cx="12" cy="12" r="1.5" />
        <circle cx="19" cy="12" r="1.5" />
      </svg>
      {{ 'Others' | t }}
    </a>
  </nav>
</div>
<div class="workspace" [class.live-page]="liveTable()">
  <div class="shell">
    <main id="main">
      <router-outlet />
    </main>
  </div>
</div>
